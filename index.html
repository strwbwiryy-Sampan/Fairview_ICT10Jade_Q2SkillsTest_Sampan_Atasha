<!DOCTYPE html>

<head>

    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Skills Test</title>

        form{

            height: 400px;

            font-size: 30px;

            width: 100px;

<body>
    <h1>Non-Metallic Elements</h1>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                
                <form>
                     <Instructions style="background-color: #a8d7ff; padding: 10px; font-size: 20px; text-align: center;">Enter the symbol of a non-metallic element to check its details.</Instructions>

                     <br><br>
   
                    <label for="elements">Enter an Element Symbol</label>
                    <br>
                    <input type="text" id="elements" class="form-control">
                    <br>
                    <button type="button" class="btn btn-dark" py-click="check_element">Check Details</button>
                    <br>
                </form>

            </div>
        </div>
    </div>
    
    <div id="output1"></div>
